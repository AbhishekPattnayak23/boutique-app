<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Boutique</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f5f5f5;
        }
        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .welcome-message {
            margin-bottom: 30px;
        }
        .user-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
        }
        .logout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4a80ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .logout-btn:hover {
            background-color: #3a70f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard</h1>
            <div id="auth-status" class="status-logged-in">Logged in</div>
        </header>

        <main>
            <div class="dashboard-container">
                <div class="welcome-message">
                    <p id="welcomeMessage">Welcome to your dashboard!</p>
                </div>
                <div class="user-info">
                    <h3>Your Account Information</h3>
                    <p id="userEmail">Email: </p>
                    <p id="userName">Name: </p>
                    <p id="userRole">Role: </p>
                    <p id="loginTime">Login time: </p>
                </div>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </main>

        <footer>
            <p>Secure Authentication Demo &copy; 2023</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="feedback.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user is authenticated
            if (window.auth && !window.auth.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }
            
            // Try both auth methods for compatibility
            const authToken = localStorage.getItem('authToken');
            if (!authToken && (!window.auth || !window.auth.isAuthenticated())) {
                window.location.href = 'index.html';
                return;
            }

            let user;
            
            // Get user data from window.auth if available
            if (window.auth && window.auth.getCurrentUser()) {
                user = window.auth.getCurrentUser();
            } else {
                // Fallback to localStorage
                user = JSON.parse(localStorage.getItem('user') || '{}');
            }
            
            const loginTime = new Date(localStorage.getItem('loginTime')).toLocaleString();

            // Update UI
            document.getElementById('welcomeMessage').textContent = `Welcome, ${user.name || user.username || 'User'}!`;
            document.getElementById('userEmail').textContent = `Email: ${user.email || 'N/A'}`;
            document.getElementById('userName').textContent = `Name: ${user.name || user.username || 'N/A'}`;
            if (user.role) {
                document.getElementById('userRole').textContent = `Role: ${user.role}`;
            } else {
                document.getElementById('userRole').textContent = 'Role: User';
            }
            document.getElementById('loginTime').textContent = `Login time: ${loginTime}`;

            // Handle logout
            document.getElementById('logoutBtn').addEventListener('click', () => {
                // Clear localStorage auth data
                localStorage.removeItem('authToken');
                localStorage.removeItem('user');
                localStorage.removeItem('loginTime');
                
                // Use auth.js logout if available
                if (window.auth && typeof window.auth.logout === 'function') {
                    window.auth.logout();
                }
                
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Boutique Shop</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        .logout-button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #4a6fa5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .logout-button:hover {
            background-color: #3b5a88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Dashboard</h1>
        <p>You have successfully logged in!</p>
        <p>This is a placeholder dashboard page for the login demo.</p>
        <button id="logoutButton" class="logout-button">Logout</button>
    </div>

    <script>
        // Simple logout functionality
        document.getElementById('logoutButton').addEventListener('click', function() {
            // Clear auth state
            localStorage.removeItem('authToken');
            localStorage.removeItem('authExpiry');
            sessionStorage.removeItem('authToken');

            // Redirect to login page
            window.location.href = 'index.html';
        });

        // Check if user is authenticated
        function checkAuth() {
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            if (!token) {
                window.location.href = 'index.html';
            }
        }

        // Run auth check when page loads
        checkAuth();
    </script>
</body>
</html>
