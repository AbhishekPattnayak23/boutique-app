<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Boutique Shop Login">

    <!-- Security headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">

    <title>Boutique Login</title>

    <!-- Preload critical resources -->
    <link rel="preload" href="css/styles.css" as="style">
    <link rel="preload" href="js/auth.js" as="script">
    <link rel="preload" href="js/validation.js" as="script">
    <link rel="preload" href="js/feedback.js" as="script">
    <link rel="preload" href="assets/images/logo.png" as="image" fetchpriority="high">

    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo-container">
                <img src="assets/images/logo.png" alt="Boutique Logo" class="logo">
                <h1>Welcome Back</h1>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required autocomplete="username" aria-describedby="emailError">
                    <div id="emailError" class="error-message" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" aria-describedby="passwordError">
                        <button type="button" id="passwordToggle" class="password-toggle" aria-label="Toggle password visibility">
                            <span class="show-password">Show</span>
                        </button>
                    </div>
                    <div id="passwordError" class="error-message" aria-live="polite"></div>
                    <div id="passwordStrength" class="password-strength-meter" aria-live="polite"></div>
                </div>

                <div class="form-group remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <div class="form-group">
                    <button type="submit" id="loginButton" class="login-button">
                        <span class="button-text">Log In</span>
                        <span class="button-loader"></span>
                    </button>
                </div>

                <div class="form-links">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <a href="#" class="create-account">Create Account</a>
                </div>
            </form>

            <div id="notificationArea" class="notification-area" aria-live="assertive"></div>
        </div>
    </div>

    <!-- Scripts loaded at end of body for performance -->
    <script src="js/validation.js" defer></script>
    <script src="js/feedback.js" defer></script>
    <script src="js/auth.js" defer></script>

    <!-- Performance measurement -->
    <script>
    window.addEventListener('load', function() {
        // Simple performance measurement
        if (window.performance) {
            const timing = performance.timing;
            const pageLoadTime = timing.loadEventEnd - timing.navigationStart;
            console.log(`Page load time: ${pageLoadTime}ms`);
        }
    });
    </script>
</body>
</html>
