<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo-container">
                <img src="assets/images/logo.png" alt="Boutique Logo" class="logo">
            </div>
            <h1>Sign In</h1>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Email or Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" aria-describedby="username-error">
                    <div id="username-error" class="error-message" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="password-error">
                        <button type="button" id="toggle-password" aria-label="Toggle password visibility">
                            <span class="show-password">Show</span>
                            <span class="hide-password">Hide</span>
                        </button>
                    </div>
                    <div id="password-error" class="error-message" aria-live="polite"></div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <label for="remember-me">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" id="login-button" disabled>Sign In</button>
            </form>

            <div id="login-message" class="message" aria-live="assertive"></div>

            <div class="signup-link">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/feedback.js"></script>
</body>
</html>
