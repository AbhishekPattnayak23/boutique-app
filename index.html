<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Security headers implemented as meta tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <!-- Content Security Policy to prevent XSS attacks -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self';">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Boutique Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="Boutique Logo" class="logo">
        </div>
        <h1>Welcome Back</h1>

        <form id="loginForm" autocomplete="on">
            <!-- CSRF token hidden field -->
            <input type="hidden" id="csrfToken" name="csrfToken">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <!-- Added autocomplete attribute for better security -->
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <div class="error-message" id="passwordError"></div>
                <!-- Password strength indicator -->
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar"></div>
                    <span class="strength-text"></span>
                </div>
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-button">Login</button>

            <div class="login-feedback" id="loginFeedback"></div>
        </form>

        <div class="register-link">
            Don't have an account? <a href="#">Register Now</a>
        </div>
    </div>

    <!-- Load scripts at the end for better performance -->
    <script src="js/validation.js"></script>
    <script src="js/feedback.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
