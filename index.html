<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure login page for Boutique shop">
    <title>Boutique | Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo-container">
                <img src="assets/images/logo.png" alt="Boutique Logo" class="logo">
            </div>

            <h1>Welcome Back</h1>
            <p class="subtitle">Please login to your account</p>

            <div id="feedbackContainer" class="feedback-container"></div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        aria-required="true"
                    >
                    <div class="validation-message" id="emailValidation"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        aria-required="true"
                    >
                    <div class="validation-message" id="passwordValidation"></div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="submit-button" id="loginButton">Login</button>
            </form>

            <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/feedback.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
