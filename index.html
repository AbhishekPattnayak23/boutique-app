<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Secure Authentication System</h1>
            <div id="auth-status" class="status-logged-out">Not logged in</div>
        </header>

        <main>
            <section class="login-section">
                <h2>Login</h2>
                <form id="login-form" data-validate="true">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" data-validate="required" placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" data-validate="required" placeholder="Enter your password">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn primary">Login</button>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                </form>

                <div class="login-help">
                    <p>Demo accounts:</p>
                    <ul>
                        <li>Username: admin, Password: admin123</li>
                        <li>Username: user, Password: user123</li>
                    </ul>
                </div>
            </section>

            <section class="protected-content">
                <h2>Welcome Back!</h2>
                <p>You are now logged in to the secure area.</p>
                <button id="logout-button" class="btn secondary">Logout</button>
            </section>
        </main>

        <footer>
            <p>Secure Authentication Demo &copy; 2023</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="feedback.js"></script>
    <script src="validation.js"></script>
    <script src="auth.js"></script>
</body>
</html>
