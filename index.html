<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Login</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Added validation.js and auth.js scripts -->
  <script src="validation.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="login-container">
    <img src="https://via.placeholder.com/120x60?text=Logo" alt="Boutique Logo" class="logo">
    <h1>Welcome Back</h1>

    <form id="loginForm" class="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="your@email.com"
          autocomplete="email"
          required
        >
        <div class="error-message" id="emailError">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder=""
          autocomplete="current-password"
          required
        >
        <span class="password-toggle" id="passwordToggle"></span>
        <div class="error-message" id="passwordError">Password must be at least 8 characters.</div>
      </div>

      <button type="submit" class="btn btn-primary" id="loginButton">
        Log In
      </button>

      <div class="success-message" id="loginSuccess">Login successful! Redirecting...</div>

      <div class="helper-links">
        <a href="#" id="forgotPassword">Forgot Password?</a>
        <a href="#" id="createAccount">Create Account</a>
      </div>
    </form>
  </div>

  <script>
    // Basic validation and interaction enhancement
    document.addEventListener('DOMContentLoaded', function() {
      // Toggle password visibility
      const passwordToggle = document.getElementById('passwordToggle');
      const passwordField = document.getElementById('password');

      if(passwordToggle && passwordField) {
        passwordToggle.addEventListener('click', function() {
          const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordField.setAttribute('type', type);
          passwordToggle.textContent = type === 'password' ? '' : '';
        });
      }

      // Simple form validation (will be enhanced by validation.js)
      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const emailError = document.getElementById('emailError');
      const passwordInput = document.getElementById('password');
      const passwordError = document.getElementById('passwordError');
      const loginButton = document.getElementById('loginButton');
      const loginSuccess = document.getElementById('loginSuccess');

      if(loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          let isValid = true;

          // Very basic validation (will be replaced by validation.js)
          if(!emailInput.value || !emailInput.value.includes('@')) {
            emailInput.classList.add('error');
            if(emailError) emailError.classList.add('visible');
            isValid = false;
          } else {
            emailInput.classList.remove('error');
            if(emailError) emailError.classList.remove('visible');
          }

          if(!passwordInput.value || passwordInput.value.length < 8) {
            passwordInput.classList.add('error');
            if(passwordError) passwordError.classList.add('visible');
            isValid = false;
          } else {
            passwordInput.classList.remove('error');
            if(passwordError) passwordError.classList.remove('visible');
          }

          if(isValid) {
            // Show loading state
            loginButton.classList.add('btn-loading');

            // Simulate API call (will be replaced by auth.js)
            setTimeout(function() {
              loginButton.classList.remove('btn-loading');
              if(loginSuccess) {
                loginSuccess.classList.add('visible');
              }
              console.log('Login successful!');
            }, 1500);
          }
        });
      }
    });
  </script>
</body>
</html>
